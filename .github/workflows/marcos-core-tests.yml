name: marcos-core-tests
on:
  pull_request:
    branches:
      - main

jobs:
  marcos-core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run marcos-core tests
        run: bash apps/marcos-aws/local/test-native.sh
