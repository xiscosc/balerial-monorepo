name: marcos-core-tests
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  marcos-core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run marcos-core tests
        run: |
          set -o pipefail
          bash apps/marcos-aws/local/test-native.sh 2>&1 | tee core-tests.log

      - name: Read test results
        id: results
        if: always()
        run: |
          [ -f core-tests.log ] || exit 0
          count() {
            sed 's/\x1b\[[0-9;]*m//g' core-tests.log | grep -E "^ *[0-9]+ $1\$" | awk '{ total += $1 } END { print total + 0 }'
          }
          echo "passed=$(count pass)" >> "$GITHUB_OUTPUT"
          echo "failed=$(count fail)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(count skip)" >> "$GITHUB_OUTPUT"

      - name: Report to Slack
        if: always()
        uses: ./.github/actions/slack-test-report
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suite: marcos-core-tests
          status: ${{ job.status }}
          passed: ${{ steps.results.outputs.passed }}
          failed: ${{ steps.results.outputs.failed }}
          skipped: ${{ steps.results.outputs.skipped }}
