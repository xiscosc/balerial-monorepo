name: marcos-core-tests
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  marcos-core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run marcos-core tests
        run: bash apps/marcos-aws/local/test-native.sh "$RUNNER_TEMP/marcos-core-results"

      - name: Publish test summary
        if: always()
        uses: ./.github/actions/test-report
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suite: Marcos integration tests
          status: ${{ job.status }}
          format: junit
          results-path: ${{ runner.temp }}/marcos-core-results
