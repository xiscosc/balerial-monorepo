name: marcos-e2e
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  marcos-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Record start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/marcos

      - name: Run e2e tests
        run: bash apps/marcos-aws/local/e2e-native.sh

      - name: Check for flaky tests
        id: results
        if: always()
        run: |
          file=apps/marcos/playwright-results.json
          if [ -f "$file" ]; then
            jq -r '"flaky=\(.stats.flaky > 0)"' "$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        id: playwright-report
        if: failure() || steps.results.outputs.flaky == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/marcos/playwright-report/
            apps/marcos/test-results/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: ./.github/actions/test-report
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suite: Marcos E2E
          status: ${{ job.status }}
          format: playwright
          results-path: apps/marcos/playwright-results.json
          artifact-url: ${{ steps.playwright-report.outputs.artifact-url }}
