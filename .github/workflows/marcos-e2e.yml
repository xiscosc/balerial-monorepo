name: marcos-e2e
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  marcos-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/marcos

      - name: Run e2e tests
        run: bash apps/marcos-aws/local/e2e-native.sh

      - name: Read test results
        id: results
        if: always()
        run: |
          file=apps/marcos/playwright-results.json
          if [ -f "$file" ]; then
            jq -r '.stats | "passed=\(.expected)\nfailed=\(.unexpected)\nflaky=\(.flaky)\nskipped=\(.skipped)"' "$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        if: failure() || (steps.results.outputs.flaky != '' && steps.results.outputs.flaky != '0')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/marcos/playwright-report/
            apps/marcos/test-results/
          retention-days: 7

      - name: Report to Slack
        if: always()
        uses: ./.github/actions/slack-test-report
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suite: marcos-e2e
          status: ${{ job.status }}
          passed: ${{ steps.results.outputs.passed }}
          failed: ${{ steps.results.outputs.failed }}
          flaky: ${{ steps.results.outputs.flaky }}
          skipped: ${{ steps.results.outputs.skipped }}
