name: Slack test report
description: Posts a summary of a test run to a Slack incoming webhook
inputs:
  webhook-url:
    description: Slack incoming webhook URL
    required: true
  suite:
    description: Name of the test suite
    required: true
  status:
    description: Job status (success, failure or cancelled)
    required: true
  passed:
    description: Number of passed tests
    default: '0'
  failed:
    description: Number of failed tests
    default: '0'
  flaky:
    description: Number of flaky tests
    default: '0'
  skipped:
    description: Number of skipped tests
    default: '0'
runs:
  using: composite
  steps:
    - name: Post to Slack
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        SUITE: ${{ inputs.suite }}
        STATUS: ${{ inputs.status }}
        PASSED: ${{ inputs.passed }}
        FAILED: ${{ inputs.failed }}
        FLAKY: ${{ inputs.flaky }}
        SKIPPED: ${{ inputs.skipped }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$WEBHOOK_URL" ]; then
          echo "SLACK_WEBHOOK_URL is not set, skipping the Slack report"
          exit 0
        fi

        case "$STATUS" in
          success) icon=":white_check_mark:"; result="passed" ;;
          cancelled) icon=":heavy_minus_sign:"; result="was cancelled" ;;
          *) icon=":x:"; result="failed" ;;
        esac

        elapsed=""
        if [ -n "${STARTED_AT:-}" ]; then
          seconds=$(( $(date +%s) - STARTED_AT ))
          elapsed="$(( seconds / 60 ))m $(( seconds % 60 ))s"
        fi

        if [ -n "$PR_NUMBER" ]; then
          title=${PR_TITLE//&/&amp;}
          title=${title//</&lt;}
          title=${title//>/&gt;}
          source="<$PR_URL|#$PR_NUMBER $title>"
        else
          source="\`$BRANCH\`"
        fi

        jq -n \
          --arg title "$icon *$SUITE* $result" \
          --arg source "$source" \
          --arg branch "$BRANCH" \
          --arg author "$AUTHOR" \
          --arg results "${PASSED:-0} passed · ${FAILED:-0} failed · ${FLAKY:-0} flaky · ${SKIPPED:-0} skipped" \
          --arg elapsed "${elapsed:-n/a}" \
          --arg run "$RUN_URL" \
          '{
            text: $title,
            blocks: [
              { type: "section", text: { type: "mrkdwn", text: $title } },
              { type: "section", fields: [
                { type: "mrkdwn", text: "*Source*\n\($source)" },
                { type: "mrkdwn", text: "*Branch*\n`\($branch)`" },
                { type: "mrkdwn", text: "*Results*\n\($results)" },
                { type: "mrkdwn", text: "*Duration*\n\($elapsed)" },
                { type: "mrkdwn", text: "*Author*\n\($author)" }
              ] },
              { type: "actions", elements: [
                { type: "button", text: { type: "plain_text", text: "View run" }, url: $run }
              ] }
            ]
          }' | curl -sSf -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK_URL"
